<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 字体：IBM Plex Sans（正文）+ IBM Plex Mono（器材标签/编号）+ 霞鹜文楷（手写标题） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字体非阻塞加载：避免外部样式表阻塞首屏渲染（Google Fonts 国内访问常慢/超时）。display=swap 已保证文字先以 fallback 显示 -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </noscript>
  <!-- 霞鹜文楷（手写楷体）：npm 切片包，按 unicode-range 只下载用到的分片 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css" />
  </noscript>
    <!-- ===== 核心 SEO（首页默认，子页面由 @unhead/vue 动态覆盖） ===== -->
    <title>Stewie 的前端实验室 | Vue 3 · TypeScript · Vite 踩坑实验报告</title>
    <meta name="description" content="把每个 bug 做成一次实验：Vue 3 踩坑实录、TypeScript 类型避坑、Vite 构建调优，每篇都有复现步骤与修复方案。拒绝空洞理论，只登记真实战例。">
    <meta name="author" content="Stewie">
    <meta name="keywords" content="前端开发, Vue 3, TypeScript, Vite, 踩坑记录, 前端博客, Pinia, CSS">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="https://stewie.fun/">

    <!-- ===== Open Graph（社交分享卡片） ===== -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stewie 的前端实验室">
    <meta property="og:title" content="Stewie 的前端实验室 | Vue 3 · TypeScript · Vite 踩坑实验报告">
    <meta property="og:description" content="把每个 bug 做成一次实验：Vue 3 踩坑实录、TypeScript 类型避坑、Vite 构建调优，每篇都有复现步骤与修复方案。">
    <meta property="og:url" content="https://stewie.fun/">
    <meta property="og:image" content="https://stewie.fun/og-image.png">
    <meta property="og:locale" content="zh_CN">

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Stewie 的前端实验室 | Vue 3 · TypeScript · Vite 踩坑实验报告">
    <meta name="twitter:description" content="把每个 bug 做成一次实验：Vue 3 踩坑实录、TypeScript 类型避坑、Vite 构建调优。">
    <meta name="twitter:image" content="https://stewie.fun/og-image.png">

    <!-- ===== 移动端 / PWA ===== -->
    <meta name="theme-color" content="#0d1a22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stewie Blog">

    <!-- ===== 结构化数据：WebSite（含站内搜索框） + Person（E-E-A-T 信号） ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://stewie.fun/#website",
          "url": "https://stewie.fun/",
          "name": "Stewie 的前端实验室",
          "description": "把每个 bug 做成一次实验：Vue 3 · TypeScript · Vite 踩坑实验报告",
          "inLanguage": "zh-CN",
          "publisher": { "@id": "https://stewie.fun/#person" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://stewie.fun/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Person",
          "@id": "https://stewie.fun/#person",
          "name": "Stewie",
          "url": "https://stewie.fun/about",
          "jobTitle": "前端工程师",
          "knowsAbout": ["Vue 3", "TypeScript", "Vite", "Pinia", "Node.js", "CSS"]
        }
      ]
    }
    </script>
    <!-- 表情小球引擎（全局脚本，按序加载：几何数据 → 表情配置 → 渲染层 → 驱动层）
         ⚠ 必须放在 head：Vite 构建会把 module 入口注入 head 末尾，
         若脚本留在 body 会排在入口之后执行，导致 window.EmotionBall 未就绪、小球全灭 -->
    <script defer src="/emotion-ball/rings.js"></script>
    <script defer src="/emotion-ball/emotions.js"></script>
    <script defer src="/emotion-ball/ball.js"></script>
    <script defer src="/emotion-ball/engine.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 应用入口（构建后 Vite 会提升到 head 末尾，位于上方 4 个引擎 defer 脚本之后，顺序安全） -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
