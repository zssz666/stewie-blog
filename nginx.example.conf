# ============================================================
# Stewie Blog — 生产部署 Nginx 配置示例（前后端同域）
# 用法：
#   1. 把下方 server_name / root 改成你的实际域名与 dist 绝对路径
#   2. 复制到 /etc/nginx/conf.d/stewie-blog.conf（或 nginx.conf 的 http 块内）
#   3. nginx -t && nginx -s reload
# 前提：
#   - 已 npm run build，dist/ 生成在前端项目下
#   - 后端 jar 已在 127.0.0.1:8081 运行（java -jar target/*.jar --server.port=8081）
#   - 前端默认 VITE_API_BASE_URL=/api（无需改动）
# ============================================================
#
# ⚠️ 宝塔面板特别注意（部署已踩坑）：
#   1. 站点「伪静态」里若有默认 rewrite 规则（如 rewrite 到 index.php），
#      会覆盖下面的 try_files，导致 /admin 等前端路由 404。
#      → 纯静态前端站请把「伪静态」内容【全部清空】再保存。
#   2. proxy_pass 用 127.0.0.1（不要写公网 IP），避免自连公网 IP 被防火墙/安全组拦截。
#   3. 若一台机器同时 listen 80 和 88，确认 80 也在此 server 块且反代生效；
#      否则统一用某个端口访问（如 :88），避免「80 的 /api 404」这类混淆。

server {
    listen 80;
    # 改成你的域名（本地测可用 localhost / 127.0.0.1）
    server_name blog.your-domain.com;

    # ============ 前端静态资源 ============
    root /path/to/Stewie-blog/dist;   # ← 改成实际绝对路径，例如 E:/work/stewie-blog/Stewie-blog/dist
    index index.html;

    # 开启 gzip，前端产物更小、首屏更快
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;
    gzip_min_length 1024;

    # ============ 大文件上传（正文图片 / 视频）============
    # ⚠️ Nginx 默认 client_max_body_size 只有 1MB，不放开会直接 413，
    #    表现为「选了视频点了上传，前端报网络错误」。必须 ≥ 后端的 multipart 上限。
    client_max_body_size 210m;
    client_body_timeout 300s;
    # 大文件从 Nginx 转发/回传后端时的读写超时，默认 60s 在慢网络下容易断
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # SPA 路由回退：所有前端深链接（/admin、/post/xxx、刷新页面）
    # 都返回 index.html，交给前端路由处理，避免 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============ 后端接口反代 ============
    # /api 转发到 Spring Boot（登录、文章、评论、管理后台均走这里）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 封面图等上传的静态文件（后端通过 WebConfig 映射 /uploads/**）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

# ============================================================
# 如需 HTTPS（推荐），在上方 server 前加：
# server {
#     listen 443 ssl;
#     server_name blog.your-domain.com;
#     ssl_certificate     /path/to/fullchain.pem;
#     ssl_certificate_key /path/to/privkey.pem;
#     # 其余 location 同上（把 root / api / uploads 搬过来）
# }
# server { listen 80; server_name blog.your-domain.com; return 301 https://$host$request_uri; }
# ============================================================

